<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Unique purple gradient - different from common platforms -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- EPG Grid - represents program guide with one row highlighted -->
  <g fill="white">
    <!-- Top row (inactive) -->
    <rect x="20" y="28" width="88" height="16" rx="4" opacity="0.4"/>

    <!-- Middle row (active/playing) - larger and bright -->
    <rect x="20" y="52" width="88" height="24" rx="6"/>

    <!-- Bottom row (inactive) -->
    <rect x="20" y="84" width="88" height="16" rx="4" opacity="0.4"/>
  </g>

  <!-- Small play indicator on the active row -->
  <circle cx="98" cy="64" r="6" fill="#22c55e"/>
</svg>
